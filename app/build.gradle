plugins {
    id 'com.android.application'
}

android {
    namespace 'ch.bertholet.irscanner'
    compileSdk 34

    defaultConfig {
        applicationId "ch.bertholet.irscanner"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
